name: Build and Publish Alpha

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Optional notes for this Alpha release'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: kujaku-alpha-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish F-Droid Alpha
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Configure production signing key
        env:
          KEYSTORE_FILE_B64: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_FILE_B64 KEYSTORE_PASSWORD_SECRET KEY_ALIAS_SECRET KEY_PASSWORD_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required signing secret: ${name}. Add the Kujaku production signing secrets before publishing releases."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_FILE_B64" | base64 --decode > "$GITHUB_WORKSPACE/kujaku-release.jks"
          {
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/kujaku-release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET"
            echo "VERSION_NAME=3.2.${GITHUB_RUN_NUMBER}"
            echo "VERSION_CODE=$(($(date +%s) / 60 + 1000000000))"
          } >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Alpha APK
        env:
          CI: 'true'
        run: ./gradlew assembleFdroidAlpha --stacktrace --no-configuration-cache

      - name: Move alpha-latest tag to this build
        run: |
          git tag -f alpha-latest "$GITHUB_SHA"
          git push origin refs/tags/alpha-latest --force

      - name: Publish Alpha GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-latest
          name: "Kujaku Alpha ${{ env.VERSION_NAME }} (Build #${{ github.run_number }})"
          body: |
            ## 🦚 Kujaku Alpha ${{ env.VERSION_NAME }}

            Automatically built from the latest `main` commit.

            ${{ inputs.release_notes }}

            This is a pre-release build for testing.
          files: app/build/outputs/apk/fdroid/alpha/*.apk
          prerelease: true
          draft: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Alpha Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: kujaku-alpha-${{ github.run_number }}
          path: app/build/outputs/apk/fdroid/alpha/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean up signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/kujaku-release.jks"

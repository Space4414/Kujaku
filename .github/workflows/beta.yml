name: Build Beta APK

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Optional notes to include in the build summary'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: kujaku-beta
  cancel-in-progress: false

jobs:
  build:
    name: Build Beta candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools;platforms;android-35;build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Beta candidate
        env:
          CI: 'true'
        run: ./gradlew assembleFdroidAlpha --stacktrace --no-configuration-cache

      - name: Upload Beta candidate
        uses: actions/upload-artifact@v4
        with:
          name: kujaku-beta-${{ github.run_number }}
          path: app/build/outputs/apk/fdroid/alpha/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          {
            echo "## 🦚 Kujaku Beta candidate"
            echo ""
            echo "- Commit: `$GITHUB_SHA`"
            echo "- APK: downloadable from this run's Artifacts section"
            echo ""
            if [ -n "$RELEASE_NOTES" ]; then
              echo "### Notes"
              printf '%s\n' "$RELEASE_NOTES"
            else
              echo "No additional release notes supplied."
            fi
            echo ""
            echo "> This is a test artifact, not a published production release."
          } >> "$GITHUB_STEP_SUMMARY"

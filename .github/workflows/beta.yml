name: Build and Publish Beta

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Optional notes for this Beta release'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: kujaku-beta-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish F-Droid Beta
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure production signing key
        env:
          KEYSTORE_FILE_B64: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_FILE_B64 KEYSTORE_PASSWORD_SECRET KEY_ALIAS_SECRET KEY_PASSWORD_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required signing secret: ${name}. Add the Kujaku production signing secrets before publishing releases."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_FILE_B64" | base64 --decode > "$GITHUB_WORKSPACE/kujaku-release.jks"
          {
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/kujaku-release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          MAJOR=3
          MINOR=$((2 + BUILD_NUMBER / 10))
          PATCH=$((BUILD_NUMBER % 10))
          MAJOR=$((MAJOR + MINOR / 10))
          MINOR=$((MINOR % 10))
          VERSION_CORE="$MAJOR.$MINOR.$PATCH"
          echo "VERSION_NAME=$VERSION_CORE - Beta"
          echo "RELEASE_TAG=beta-v$VERSION_CORE"
          echo "VERSION_CODE=$(($(date +%s) / 60 + 1000000000))"
          } >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Beta APK
        env:
          CI: 'true'
        run: ./gradlew assembleFdroidDebug --stacktrace --no-configuration-cache --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8'

      - name: Move beta-latest tag to this build
        run: |
          git tag -f beta-latest "$GITHUB_SHA"
          git push origin refs/tags/beta-latest --force
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish Beta GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Kujaku ${{ env.VERSION_NAME }}"
          body: |
            ## 🦚 Kujaku ${{ env.VERSION_NAME }}

            ${{ inputs.release_notes }}

            This is a pre-release build for testing.
          files: app/build/outputs/apk/fdroid/debug/*.apk
          prerelease: true
          draft: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Beta Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: kujaku-beta-${{ github.run_number }}
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean up signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/kujaku-release.jks"
